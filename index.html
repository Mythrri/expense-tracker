<!DOCTYPE html>
<html>
<head>
  <title>Mythrri | Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>💰 My Expense Tracker</h1>
    <p>Track your money smartly with AI tips!</p>

    <div class="balance-box">
      <h2>Total Spent: ₹<span id="total">0</span></h2>
      <p id="ai-tip">Add your first expense to get AI Tip 👇</p>
    </div>

    <div class="form">
      <input type="text" id="name" placeholder="What did you spend on? Ex: Food">
      <input type="number" id="amount" placeholder="Amount ₹ Ex: 200">
      <select id="category">
        <option>Food</option>
        <option>Travel</option>
        <option>Shopping</option>
        <option>Study</option>
        <option>Other</option>
      </select>
      <button onclick="addExpense()">Add Expense ➕</button>
    </div>

    <h3>📋 Your Expenses</h3>
    <ul id="list"></ul>
    <button class="clear" onclick="clearAll()">Clear All 🗑️</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
